[project]
name = "agent"
version = "0.1.0"
description = "AI Revision Agent - 1-on-1 Interactive AI Tutor"
readme = "README.md"
authors = [
    { name = "sha-04", email = "shamsiqbal04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=23.2.1",
    "apscheduler>=3.10.0",
    "fastapi>=0.110.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.0",
    "langgraph>=0.1.0",
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.28.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
