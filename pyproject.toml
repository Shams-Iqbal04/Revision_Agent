[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sha-04", email = "shamsiqbal04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "apscheduler>=3.11.3",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.12",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
    "streamlit>=1.65.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
